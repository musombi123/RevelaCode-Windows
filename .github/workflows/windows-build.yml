# [publish-windows-release] Publish signed-off desktop builds to the stable latest-download URL.
name: RevelaCode Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-build.yml"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Branch, tag or commit for RevelaCode-Frontend
        required: true
        default: main
        type: string
      backend_ref:
        description: Branch, tag or commit for RevelaCode-Backend
        required: true
        default: main
        type: string
      revelaai_ref:
        description: Branch, tag or commit for RevelaAI
        required: true
        default: main
        type: string

concurrency:
  group: revelacode-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout Windows host
        uses: actions/checkout@v4

      - name: Resolve companion source refs
        id: refs
        shell: pwsh
        run: |
          $frontend = "${{ github.event.inputs.frontend_ref }}"
          $backend = "${{ github.event.inputs.backend_ref }}"
          $revelaai = "${{ github.event.inputs.revelaai_ref }}"
          if ([string]::IsNullOrWhiteSpace($frontend)) { $frontend = "main" }
          if ([string]::IsNullOrWhiteSpace($backend)) { $backend = "main" }
          if ([string]::IsNullOrWhiteSpace($revelaai)) { $revelaai = "main" }
          $desktopConfig = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $desktopVersion = [string]$desktopConfig.version
          if ([string]::IsNullOrWhiteSpace($desktopVersion)) { throw "Tauri desktop version is missing." }
          $desktopTag = "v$desktopVersion"
          "frontend=$frontend" >> $env:GITHUB_OUTPUT
          "backend=$backend" >> $env:GITHUB_OUTPUT
          "revelaai=$revelaai" >> $env:GITHUB_OUTPUT
          "desktop_version=$desktopVersion" >> $env:GITHUB_OUTPUT
          "desktop_tag=$desktopTag" >> $env:GITHUB_OUTPUT

      - name: Checkout RevelaCode Frontend
        uses: actions/checkout@v4
        with:
          repository: musombi123/RevelaCode-Frontend
          ref: ${{ steps.refs.outputs.frontend }}
          path: workspace/frontend

      - name: Checkout RevelaCode Backend
        uses: actions/checkout@v4
        with:
          repository: musombi123/RevelaCode-Backend
          ref: ${{ steps.refs.outputs.backend }}
          path: workspace/backend

      - name: Checkout RevelaAI
        uses: actions/checkout@v4
        with:
          repository: musombi123/RevelaAI
          ref: ${{ steps.refs.outputs.revelaai }}
          path: workspace/revelaai

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify all source repositories and record commits
        shell: pwsh
        run: node scripts/verify-workspace.mjs

      - name: Install Windows host dependencies
        run: npm install --no-audit --no-fund

      - name: Install existing frontend dependencies
        run: npm --prefix workspace/frontend ci

      - name: Build RevelaCode Desktop
        env:
          # Production API origins are embedded by Vite at build time for Tauri WebView.
          VITE_API_URL: "https://revelacode-backend.onrender.com"
          VITE_API_BASE_URL: "https://revelacode-backend.onrender.com"
          VITE_BACKEND_URL: "https://revelacode-backend.onrender.com"
          VITE_REVELAAI_API_URL: "https://revelaai.onrender.com"
          VITE_TAURI_APP: "true"
        run: npm run tauri:build

      - name: Prepare stable direct-download filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "The Tauri NSIS installer was not generated." }
          Copy-Item $installer.FullName "RevelaCode-Windows-Setup.exe" -Force
          Write-Host "Prepared direct-download asset: RevelaCode-Windows-Setup.exe"

      - name: Upload installer and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: revelacode-windows-x64
          path: |
            RevelaCode-Windows-Setup.exe
            artifacts/source-revisions.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download Windows release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-windows-release]'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.refs.outputs.desktop_tag }}
          name: RevelaCode Windows ${{ steps.refs.outputs.desktop_version }}
          body: |
            RevelaCode Desktop for Windows x64 (version ${{ steps.refs.outputs.desktop_version }}).

            Download RevelaCode-Windows-Setup.exe for a direct installer download. The installer includes the WebView2 offline runtime.
          generate_release_notes: true
          make_latest: true
          files: |
            RevelaCode-Windows-Setup.exe
            artifacts/source-revisions.json
