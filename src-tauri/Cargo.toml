[package]
name = "revelacode-desktop"
version = "0.1.0"
description = "RevelaCode Desktop for Windows"
authors = ["RevelaCode"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
